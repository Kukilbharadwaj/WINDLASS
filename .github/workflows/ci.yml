name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check . --output-format=github

      - name: black
        run: black --check --diff .

      - name: mypy
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Run the suite
        run: pytest -m "not network" --cov=windlass --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  core-install:
    name: Core install stays tiny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The core install must work on its own, and must not drag in an
      # optional dependency. This job is what stops that regressing.
      - name: Install core only
        run: pip install -e .

      - name: Smoke test with no extras
        run: |
          windlass doctor
          windlass list
          python -c "
          from windlass import Windlass
          rag = Windlass.rag()
          assert rag.ingest_text('Windlass is a modular AI framework.') >= 1
          assert rag.ask('What is Windlass?').contexts
          agent = Windlass.agent().llm('fake', responses=['ok'])
          assert agent.run('hi').output == 'ok'
          print('core-only pipeline works')
          "

      - name: No optional dependency is imported at import time
        run: |
          python -c "
          import sys, windlass
          leaked = [m for m in ('numpy','openai','anthropic','langgraph','chromadb',
                                'faiss','torch','tiktoken','sentence_transformers')
                    if m in sys.modules]
          assert not leaked, f'import windlass pulled in: {leaked}'
          print('import graph is clean')
          "

  examples:
    name: Examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Run the dependency-free examples
        run: |
          for dir in examples/0[1-8]_*/; do
            echo "=== $dir ==="
            python "$dir/main.py"
          done

  extras:
    name: Optional extras import cleanly
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [openai, anthropic, agent, mcp, chroma, faiss, loaders]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[${{ matrix.extra }}]" pytest pytest-asyncio

      - name: Suite still passes with the extra installed
        run: pytest -m "not network" -q

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[docs]"

      - name: Build (warnings are errors)
        run: mkdocs build --strict

  build:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [lint, test, core-install]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine

      - run: python -m build

      - run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, docs, examples]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write        # trusted publishing — no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
